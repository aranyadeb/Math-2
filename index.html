<head>
<meta charset="utf-8">

<meta name="description" content="Every JEE Advanced maths formula, with derivations, graphs and quick recap sheets. Read, mark and practise.">

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<meta name="theme-color" content="#1A2238">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths 100">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout: chapter tiles coloured by unit; the player climbs through great mathematicians. */
:root{
  --bench:#E9EEF4; --surface:#FFFFFF; --ink:#1A2238; --muted:#5B6478; --line:#CDD5E0;
  --good:#1F8A4C; --bad:#C4302B;
  --pb:#D7263D; --df:#E89B00; --pt:#4E9A2F; --cb:#0E8F8A; --cc:#8A4FD8;
  --solid:#1A2238; --on-solid:#FFFFFF; --good-bg:#E8F5ED; --bad-bg:#FBEAE9; --scrim:rgba(26,34,56,.45);
  --flame:var(--cb);
  --r-tile:6px; --r-btn:999px;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bench:#121726;--surface:#1B2236;--ink:#E8ECF5;--muted:#A3ACC0;--line:#323C57;--solid:#E8ECF5;--on-solid:#121726;--good:#3FBF74;--bad:#F06A64;--good-bg:#173526;--bad-bg:#3A1E22;--scrim:rgba(0,0,0,.6);--pb:#F0566B;--df:#F5B833;--pt:#79C455;--cb:#2EC4BC;--cc:#B18CF0;color-scheme:dark}}
:root[data-theme="dark"]{--bench:#121726;--surface:#1B2236;--ink:#E8ECF5;--muted:#A3ACC0;--line:#323C57;--solid:#E8ECF5;--on-solid:#121726;--good:#3FBF74;--bad:#F06A64;--good-bg:#173526;--bad-bg:#3A1E22;--scrim:rgba(0,0,0,.6);--pb:#F0566B;--df:#F5B833;--pt:#79C455;--cb:#2EC4BC;--cc:#B18CF0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bench);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
body{min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:12px;padding:10px 0 18px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand .burner{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--pb),var(--df),var(--pt),var(--cb),var(--cc),var(--pb));box-shadow:0 0 0 3px var(--surface)}
.topstats{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:15px;color:var(--muted)}
.topstats b{color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-btn);padding:6px 12px;font-size:14px}

/* element tile = signature */
.tile{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r-tile);padding:14px 16px 16px}
.tile .z{position:absolute;top:8px;left:12px;font-family:var(--display);font-weight:700;font-size:15px}
.tile .mass{position:absolute;top:8px;right:12px;font-size:13px;color:var(--muted)}
.tile .sym{font-family:var(--display);font-weight:800;font-size:68px;line-height:1;letter-spacing:-.03em;margin:22px 0 4px}
.tile .nm{font-size:15px}

.hero{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:stretch;margin-bottom:26px}
.hero .tile{display:flex;flex-direction:column;justify-content:flex-end;min-height:200px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0 0 10px}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.xpbar{height:12px;background:var(--surface);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pb),var(--df),var(--pt),var(--cb),var(--cc));width:0;transition:width .6s}
.xpnote{font-size:14px;color:var(--muted);margin-top:6px}

h2.sec{font-family:var(--display);font-weight:700;font-size:21px;margin:28px 0 12px}
.chapters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.chap{--c:var(--cb);text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-tile);padding:10px 12px 12px;position:relative;min-height:118px}
.chap[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.chap .sym{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;color:var(--c);margin:16px 0 4px}
.chap .z{position:absolute;top:8px;left:10px;font-size:13px;font-weight:700}
.chap .pct{position:absolute;top:8px;right:10px;font-size:13px;color:var(--muted)}
.chap .nm{font-size:14px;line-height:1.25}
.chap .meter{height:5px;background:var(--bench);border-radius:3px;margin-top:8px;overflow:hidden}
.chap .meter i{display:block;height:100%;background:var(--c)}
.katex{font-size:1.06em}
.pyqb{display:inline-block;margin-top:12px;padding:4px 10px;border-radius:999px;background:var(--bench);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink)}
.qcard .q .tag{display:block;font-family:var(--body);font-size:13px;font-weight:700;color:var(--flame);margin-bottom:4px}
.qcard .a .katex-display{margin:.2em 0;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.qcard .a{font-weight:400;font-size:21px;text-align:center;line-height:2.1}
.recap .rf{padding:3px 0;line-height:2}
.rrow .ra{line-height:2}
.note{margin-top:10px;font-size:16px;line-height:1.5;color:var(--ink)}
.deriv{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bench)}
.deriv summary{cursor:pointer;font-weight:700;font-size:15px}
.deriv div{margin-top:8px;line-height:1.6;font-size:15.5px}
.graph{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px}
.graph svg{display:block;width:100%;height:auto;max-height:300px}
.graph .lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);padding:2px 6px 4px}
.graph .lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.unit{margin:18px 0 8px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:16px}
.unit::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.unit button{margin-left:auto;font-size:13px;padding:4px 10px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700}
.chapters .chap{min-height:96px}
.chapters .chap .sym{font-size:28px;margin:14px 0 4px}
.rrow .ra .katex-display{display:inline-block;margin:0}
.rrow .ra{font-weight:400;color:var(--ink)}
.lq .katex-display,.la .katex-display{margin:2px 0}
.recap{columns:2 420px;column-gap:28px}
.recap .rg{break-inside:avoid;margin:0 0 14px}
.recap h3{font-family:var(--display);font-size:18px;margin:18px 0 6px;column-span:all;color:var(--c)}
.recap h4{font-size:14px;margin:0 0 4px;color:var(--muted);font-weight:700}
.recap .ri{break-inside:avoid;padding:6px 0;border-bottom:1px dashed var(--line)}
.recap .ri .rp{font-size:13.5px;color:var(--muted)}
.recap .ri .katex-display{margin:2px 0;text-align:left;overflow-x:auto;overflow-y:hidden}
.recap .ri .katex-display>.katex{text-align:left}
.recap .rn{font-size:13px;color:var(--muted)}
.recapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.mode.recapm{background:var(--surface);color:var(--ink);border:2px solid var(--c,var(--ink))}
/* method blocks + larger reading text */
.mb{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bench);font-size:19px;line-height:1.6}
.mb .ml{font-family:var(--display);font-weight:800;font-size:15px;color:var(--flame);margin-bottom:4px}
.mb.ex{background:var(--surface);border:2px dashed var(--line)}
.mb.trap{background:var(--bad-bg)}.mb.trap .ml{color:var(--bad)}
ol.steps{margin:4px 0 0;padding-left:1.4em}ol.steps li{margin:6px 0}
html,body{font-size:19px}
.qcard .q{font-size:clamp(25px,4vw,32px)!important;line-height:1.3}
.qcard .a{font-size:25px!important}
.note{font-size:19px!important}.hook{font-size:18px!important}.ref{font-size:15px!important}
.qcard .meta{font-size:15px!important}.qcard .q .tag{font-size:15px!important}.pyqb{font-size:15px!important}
.rrow{font-size:19px;line-height:1.55}.rrow .rh{font-size:16px!important}.rrow .n{font-size:15px!important}
.lq,.la{font-size:18px}
.recap .ri .rp{font-size:16px!important}.recap .ri{font-size:18px}.recap .rn{font-size:15.5px!important}.recap h4{font-size:16px!important}
.katex{font-size:1.12em!important}
.mode .d{font-size:16px!important}.mode .t{font-size:24px!important}.mode .n{font-size:15px!important}
.chap .nm{font-size:16px!important}.hint{font-size:17px!important}.count{font-size:16px!important}
.marks button{font-size:16px!important}.rnav button,.judge button{font-size:20px!important}.keys{font-size:15px!important}
@media (max-width:600px){.qcard .q{font-size:25px!important}.qcard .a{font-size:22px!important}.mb{font-size:18px}}
/* ===== dark, quiet theme ===== */
:root{--bench:#0d0f12!important;--surface:#16191e!important;--ink:#e8eaed!important;--muted:#99a0aa!important;--line:#2c3037!important;--solid:#2a2e35!important;--on-solid:#f0f1f3!important;--good:#93b59e!important;--bad:#cf9a9a!important;--good-bg:#18211b!important;--bad-bg:#2a1d1d!important;--scrim:rgba(0,0,0,.72)!important;--pb:#8d9199!important;--df:#9b968c!important;--pt:#909a90!important;--cb:#8d9a9a!important;--cc:#979198!important;color-scheme:dark}
html,body{background:#0d0f12!important;color:#e8eaed}
.wrap{max-width:min(1800px,100%)!important}
.play{max-width:920px!important}
.play.wide{max-width:none!important}
.mode,.cnt[aria-pressed="true"],.rview button[aria-pressed="true"],.rnav .go,.btn.primary{background:#2a2e35!important;color:#f0f1f3!important;border-color:#3a3f47!important}
.mode.read,.mode.recapm,.mode.tough,.mode.pin,.mode.easy{background:#16191e!important;color:#e8eaed!important;border:2px solid #2c3037!important}
.mode .t,.mode.tough .t,.mode.easy .t{color:#e8eaed!important}
.judge .j-know,.judge .j-next{background:#2f3a33!important;border-color:#3d4a41!important;color:#eef3ef!important}
.chap[aria-pressed="true"]{border-color:#c9ced6!important;box-shadow:inset 0 0 0 2px #c9ced6!important}
.chap .sym{color:#d9dde3!important}
.xpbar i,.prog i{background:#8d939c!important}
.tile{border-color:#3a3f47!important}
/* formula boxes, side by side */
.recap{columns:auto!important;display:block}
.recap h3{font-size:24px!important;margin:30px 0 10px;color:#e8eaed!important}
.recap .rg{margin:0 0 18px}
.recap h4{font-size:17px!important;margin:14px 0 8px;color:#a9b0ba!important}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,21em),1fr));gap:14px}
.recap .ri{background:#16191e;border:1px solid #2c3037!important;border-radius:12px;padding:14px 16px;font-size:19px}
.recap .ri .rp{font-size:16.5px!important;color:#a9b0ba;margin-bottom:6px}
.rlist{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(min(100%,23em),1fr));gap:14px;background:none!important;border:0!important;overflow:visible!important}
.rrow{background:#16191e;border:1px solid #2c3037!important;border-radius:12px;padding:16px 18px!important;font-size:19px!important}
.list{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(min(100%,23em),1fr));gap:14px}
.li{background:#16191e;border:1px solid #2c3037!important;border-radius:12px;padding:14px 16px;font-size:18px}
#backBtn{font-size:16px;margin-right:6px}
/* even larger reading text */
html,body{font-size:20px}
.qcard .q{font-size:clamp(26px,3.6vw,34px)!important}
.qcard .a{font-size:27px!important}
.mb{font-size:20px}.note{font-size:20px!important}
@media (max-width:600px){.qcard .q{font-size:25px!important}.qcard .a{font-size:23px!important}.mb{font-size:18.5px}}
@media print{header,.recapbar,.playbar{display:none!important}body{background:#fff}.recap{columns:2}}
.counts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cnt{min-width:56px;padding:10px 14px;border-radius:var(--r-btn);border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:16px}
.cnt[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.cnt-own{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.cnt-own input{width:84px;font:inherit;font-size:16px;padding:9px 10px;border:2px solid var(--line);border-radius:var(--r-btn);background:var(--surface);color:var(--ink)}
.cnt-own input.on{border-color:var(--solid)}
.hint{margin-top:10px;font-size:15px;color:var(--muted)}
.secpick{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
select{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode.read{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.rview{display:flex;gap:6px;margin-left:auto}
.rview button{padding:6px 12px;border-radius:var(--r-btn);border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.rview button[aria-pressed="true"]{border-color:var(--ink);background:var(--solid);color:var(--on-solid)}
.rcard .a{margin-top:14px}
.rnav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:20px}
.rnav button{padding:15px 10px;border-radius:var(--r-tile);border:2px solid var(--ink);background:var(--surface);font-family:var(--display);font-weight:700;font-size:18px}
.rnav .go{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.rlist{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-tile);overflow:hidden}
.rrow{padding:12px 16px;border-bottom:1px solid var(--line);line-height:1.45}
.rrow:last-child{border-bottom:0}
.rrow .n{color:var(--muted);font-size:13px;margin-right:6px}
.rrow .rq{font-weight:600}
.rrow .ra{font-weight:700;color:var(--good)}
.rrow .rh{font-size:13px;color:var(--muted);margin-top:3px}
.rrow .rt{float:right;margin-left:8px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted)}
.rrow .rt[aria-pressed="true"]{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.marks{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.marks button{flex:1;min-width:0;padding:9px 8px;border-radius:var(--r-btn);border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--muted)}
.marks button[data-mk="e"][aria-pressed="true"]{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.marks button[data-mk="t"][aria-pressed="true"]{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.marks button[data-mk="p"][aria-pressed="true"]{border-color:var(--ink);color:var(--on-solid);background:var(--solid)}
.marks.sm{float:right;margin:0 0 4px 10px;gap:4px}
.marks.sm button{flex:none;padding:3px 8px;font-size:12px;border-width:1px}
.judge.one{grid-template-columns:1fr}
.mode.pin{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.mode.easy{background:var(--surface);color:var(--ink);border:2px dashed var(--good)}
.mode.easy .t{color:var(--good)}
.rdone{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.mode{background:var(--solid);color:var(--on-solid);border:0;border-radius:var(--r-tile);padding:16px;text-align:left;min-height:132px;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.mode:hover{transform:translateY(-2px)}
.mode .t{font-family:var(--display);font-weight:800;font-size:22px}
.mode .d{font-size:14px;opacity:.85;line-height:1.35}
.mode .n{margin-top:auto;font-size:13px;opacity:.75}
.mode.tough{background:var(--surface);color:var(--ink);border:2px dashed var(--bad)}
.mode.tough .t{color:var(--bad)}
.mode:disabled{opacity:.45;cursor:not-allowed;transform:none}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r-tile);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}

/* play screen */
.play{max-width:760px;margin:0 auto}
.playbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:8px;background:var(--surface);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--flame);transition:width .3s}
.combo{font-family:var(--display);font-weight:800;font-size:18px;min-width:70px;text-align:right}
.timer{font-family:var(--display);font-weight:800;font-size:26px;min-width:56px;text-align:right}
.qcard{background:var(--surface);border:2px solid var(--ink);border-left:12px solid var(--flame);border-radius:var(--r-tile);padding:20px 22px 22px;position:relative}
.qcard .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px}
.qcard .q{font-family:var(--display);font-weight:700;font-size:clamp(21px,3.4vw,27px);line-height:1.25;letter-spacing:-.01em}
.qcard .a{font-size:20px;font-weight:700;color:var(--ink);margin-top:16px;padding-top:14px;border-top:2px dashed var(--line)}
.hook{margin-top:12px;font-size:15px;background:var(--bench);border-radius:8px;padding:10px 12px}
.hook b{font-family:var(--display)}
.ref{margin-top:8px;font-size:13px;color:var(--muted)}
.star{position:absolute;top:12px;right:14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.star[aria-pressed="true"]{border-color:var(--bad);color:var(--bad);font-weight:700}
.qcard .meta{padding-right:110px}
.reveal{margin-top:18px;width:100%;padding:16px;border-radius:var(--r-tile);border:2px solid var(--ink);background:var(--solid);color:var(--on-solid);font-family:var(--display);font-weight:700;font-size:19px}
.judge{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:20px}
.judge button{padding:15px 10px;border-radius:var(--r-tile);border:2px solid var(--ink);background:var(--surface);font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2}
.judge button small{display:block;font-family:var(--body);font-weight:400;font-size:12px;opacity:.8;margin-top:2px}
.judge .j-know,.judge .j-next{background:var(--good);border-color:var(--good);color:var(--on-solid)}
.judge .j-tough{border-color:var(--bad);color:var(--bad)}
.judge .j-tough[aria-pressed="true"]{background:var(--bad-bg)}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prev{margin-top:12px;font-size:14px;color:var(--muted)}
.prev summary{cursor:pointer}
.prev div{margin-top:6px;background:var(--surface);border-radius:8px;padding:10px 12px;color:var(--ink)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.rate button{padding:14px 8px;border-radius:var(--r-tile);border:2px solid var(--ink);background:var(--surface);font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2}
.rate button small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.rate .r-t{border-color:var(--bad);color:var(--bad)}
.rate .r-k{background:var(--good);border-color:var(--good);color:var(--on-solid)}
.rate .r-k small{color:inherit;opacity:.85}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{text-align:left;padding:13px 14px 13px 46px;border-radius:var(--r-tile);border:2px solid var(--line);background:var(--surface);position:relative;font-size:17px;line-height:1.35}
.opt .k{position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:5px;background:var(--bench);font-size:13px;font-weight:700;display:grid;place-items:center}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--ink)}
.next{margin-top:16px;width:100%;padding:15px;border-radius:var(--r-tile);border:2px solid var(--ink);background:var(--solid);color:var(--on-solid);font-family:var(--display);font-weight:700;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--solid);color:var(--on-solid);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.xpfly{position:absolute;right:18px;bottom:18px;font-family:var(--display);font-weight:800;color:var(--good);font-size:22px;animation:fly .9s ease-out forwards;pointer-events:none}
@keyframes fly{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.flip{animation:flip .28s ease-out}
@keyframes flip{from{transform:rotateX(14deg);opacity:.4}to{transform:none;opacity:1}}
.keys{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}

/* summary + tough list */
.summary{max-width:640px;margin:0 auto;text-align:center}
.summary .tile{display:inline-block;min-width:200px;text-align:left;margin:6px 0 18px;border-color:var(--flame)}
.summary h2{font-family:var(--display);font-weight:800;font-size:36px;margin:0 0 6px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{padding:12px 18px;border-radius:var(--r-btn);border:2px solid var(--ink);background:var(--surface);font-family:var(--display);font-weight:700;font-size:16px}
.btn.primary{background:var(--solid);color:var(--on-solid)}
.list{display:grid;gap:8px;margin-top:12px}
.li{background:var(--surface);border-left:6px solid var(--c,var(--bad));border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.li .lq{font-weight:700}
.li .la{color:var(--muted);font-size:15px}
.empty{background:var(--surface);border-radius:var(--r-tile);padding:22px;text-align:center;color:var(--muted)}
.loading{display:grid;place-items:center;min-height:60vh;font-family:var(--display);font-size:20px;gap:10px;text-align:center}
.dlg{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:16px;z-index:8}
.dlg.open{display:flex}
.dlg .box{background:var(--surface);border-radius:10px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.dlg h3{font-family:var(--display);margin:0 0 8px;font-size:22px}
.dlg textarea{width:100%;min-height:110px;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:8px}
.toggle{display:flex;align-items:center;gap:10px;margin:10px 0}
sub,sup{font-size:.72em;line-height:0}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:7}
@media (max-width:820px){
  .chapters{grid-template-columns:repeat(3,1fr)}
  .modes{grid-template-columns:1fr 1fr}
  .rrow .marks.sm{float:none;margin:8px 0 0}
  .rrow{display:flex;flex-direction:column}
  .rrow>.marks.sm{order:9}
  .statgrid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  html,body{font-size:16px}
  .hero{grid-template-columns:1fr}
  .hero .tile{min-height:150px;max-width:220px}
  .chapters{grid-template-columns:repeat(2,1fr)}
  .topstats .hide-s{display:none}
  .rate button{font-size:15px}
  .qcard{padding:16px 16px 18px}
}
@media (pointer:coarse){.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header class="top">
    <button class="iconbtn" id="backBtn" hidden aria-label="Go back">← Back</button>
    <button class="brand" id="home" aria-label="Maths 100 home"><span class="burner" aria-hidden="true"></span>Maths 100</button>
    <div class="topstats">
      <span title="Days in a row">🔥 <b id="streak">0</b><span class="hide-s"> day streak</span></span>
      <span class="hide-s">XP <b id="xpTop">0</b></span>
      <button class="iconbtn" id="installApp" hidden>Install app</button>
      <button class="iconbtn" id="openSettings">Settings</button>
    </div>
  </header>
  <main id="app"><div class="loading" role="status">Loading formulas…<span style="font-family:var(--body);font-size:15px;color:var(--muted)">30 chapters of JEE Advanced maths</span></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="dlg" id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="box">
    <h3 id="setTitle">Settings</h3>
    <label class="toggle"><input type="checkbox" id="optSound"> Sound effects</label>
    <label class="toggle"><input type="checkbox" id="optShuffle"> Shuffle new cards (instead of chapter order)</label>
    <label class="toggle">Questions per round
      <select id="optRound"><option>10</option><option>15</option><option selected>20</option><option>30</option><option>50</option><option>100</option><option value="0">All</option></select></label>
    <h3 style="margin-top:18px">Move progress to another device</h3>
    <p style="font-size:14px;color:var(--muted);margin:0 0 8px">Progress is saved in this browser. Copy the code here and paste it into the game on your other device.</p>
    <textarea id="code" aria-label="Progress code"></textarea>
    <div class="row" style="justify-content:flex-start">
      <button class="btn" id="copyCode">Copy my code</button>
      <button class="btn" id="loadCode">Load pasted code</button>
      <button class="btn" id="resetAll" style="border-color:var(--bad);color:var(--bad)">Reset all progress</button>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" id="closeSettings">Done</button></div>
  </div>
</div>

<script>
"use strict";
let CHAPTERS=[];
const UNITS={'Algebra':'#a39a9a','Trigonometry':'#a8a191','Coordinate Geometry':'#97a597','Vectors & 3D':'#93a3a3','Calculus':'#a29bab','Probability & Statistics':'#97a0ad'};
const SYM={log:'Lg',quad:'Qe',cplx:'Cx',seq:'Sq',pnc:'Pc',bin:'Bn',mat:'Mx',det:'Dt',trig:'Tr',treq:'Te',tri:'Pt',itf:'It',sl:'Sl',cir:'Ci',par:'Pa',ell:'El',hyp:'Hy',vec:'Ve','3d':'3D',fn:'Fn',lim:'Li',cd:'Cd',dif:'Df',aod:'Ad',ind:'In',def:'Di',area:'Ar',de:'De',prob:'Pr',stat:'St'};
const MATHS=[['Py','Pythagoras'],['Eu','Euclid'],['Ac','Archimedes'],['Ap','Apollonius'],['Dp','Diophantus'],['Ab','Aryabhata'],['Bg','Brahmagupta'],['Kw','Al-Khwarizmi'],['Bh','Bhaskara II'],['Fb','Fibonacci'],['Mv','Madhava'],['Cr','Cardano'],['Np','Napier'],['Ds','Descartes'],['Fm','Fermat'],['Ps','Pascal'],['Nw','Newton'],['Lb','Leibniz'],['Jb','Bernoulli'],['Dm','De Moivre'],['Ty','Taylor'],['Mc','Maclaurin'],['Er','Euler'],['Lg','Lagrange'],['Lp','Laplace'],['Lr','Legendre'],['Fo','Fourier'],['Gs','Gauss'],['Cy','Cauchy'],['Ab','Abel'],['Jc','Jacobi'],['Ga','Galois'],['Rm','Riemann'],['Cn','Cantor'],['Pn','Poincaré'],['Hb','Hilbert'],['Ra','Ramanujan'],['No','Noether'],['Kg','Kolmogorov'],['Tu','Turing']];
const ELEMENTS=MATHS.map(m=>m[0]),ENAMES=MATHS.map(m=>m[1]),MAXL=MATHS.length;
const INTERVAL=[0,0,1,3,7,16]; // days per Leitner box
const DAY=864e5;
let DB=[], BYID={}, S, cur=null;
const DSHA='3aec73041fa59f659d378702e86af18d13c09c8e';

/* ---------- storage ---------- */
const KEY='maths100.v1';
function blank(){return {xp:0,cards:{},chap:['pb','df','pt','cb','cc'],sec:'',sound:true,shuffle:false,round:20,best:0,days:[],seen:0,right:0}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return Object.assign(blank(),s||{})}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();

/* ---------- text ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function kx(t,disp){try{return katex.renderToString(t,{displayMode:disp,throwOnError:false,strict:'ignore'})}catch(e){return esc(t)}}
const KC=new Map();
function chem(s){s=String(s||'');if(KC.has(s))return KC.get(s);const out=s.split(/(\$\$[^$]+\$\$|\$[^$]+\$)/).map(p=>p.startsWith('$$')?kx(p.slice(2,-2),true):p.startsWith('$')&&p.length>1?kx(p.slice(1,-1),false):esc(p)).join('');if(KC.size<6000)KC.set(s,out);return out}
function plain(s){return String(s).replace(/\$[^$]*\$/g,'…').replace(/[_^{}]/g,'')}

/* ---------- data ---------- */
async function getJSON(p){const srcs=[p,'https://cdn.jsdelivr.net/gh/aranyadeb/Math-2@'+DSHA+'/'+p,'https://raw.githubusercontent.com/aranyadeb/Math-2/'+DSHA+'/'+p];
  for(const u of srcs){try{const j=await fetch(u);if(j.ok)return await j.json()}catch(e){}}throw new Error('missing '+p)}
async function boot(){
  try{
    const idx=await getJSON('data/index.json');
    CHAPTERS=idx.chapters.map((c,i)=>({k:c.k,sym:SYM[c.k]||c.k.slice(0,2),z:i+1,name:c.t,unit:c.u,cls:c.cls,color:UNITS[c.u]||'#555'}));
    const all=await Promise.all(CHAPTERS.map(c=>getJSON('data/'+c.k+'.json')));
    all.forEach(d=>{let n=0;d.s.forEach(([title,cards],si)=>cards.forEach((x,ii)=>{n++;const id=d.k+'.'+si+'.'+ii;
      const card={id,ch:d.k,si,sec:'',stitle:title,q:x.q,a:'$\\displaystyle '+x.f+'$',f:x.f,note:x.n||'',deriv:x.d||'',hook:x.h||'',g:x.g||'',pyq:x.p||'',spot:x.r||'',steps:x.s||'',ex:x.e||'',ref:'Class '+d.cls+' · '+d.t,n};DB.push(card);BYID[id]=card}))});
  }catch(e){document.getElementById('app').innerHTML='<div class="empty">Could not load the formulas ('+esc(e.message)+'). Check your connection and reload the page.</div>';return}
  S.chap=[];S.sec='';markDay(false); home();
}

/* ---------- method cards ---------- */
function methodHtml(c){const st=c.steps?c.steps.split('||').map(x=>x.trim()).filter(Boolean):[];
  return `<div class="pyqb">${esc(c.pyq)}</div>
  ${c.spot?`<div class="mb"><div class="ml">How to spot this type</div><div>${chem(c.spot)}</div></div>`:''}
  ${st.length?`<div class="mb"><div class="ml">Steps to solve</div><ol class="steps">${st.map(x=>`<li>${chem(x)}</li>`).join('')}</ol></div>`:''}
  ${c.ex?`<div class="mb ex"><div class="ml">Worked example</div><div>${chem(c.ex)}</div></div>`:''}
  ${c.note?`<div class="mb"><div class="ml">Remember</div><div>${chem(c.note)}</div></div>`:''}
  ${c.hook?`<div class="mb trap"><div class="ml">Trap to avoid</div><div>${chem(c.hook.replace(/^Trap:\s*/,''))}</div></div>`:''}
  ${c.g?graphSvg(c.g,chapterOf(c.ch).color):''}<div class="ref">${esc(c.ref)} · ${chem(c.stitle)}</div>`}

/* ---------- graphs ---------- */
const GM={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sinh:Math.sinh,cosh:Math.cosh,exp:Math.exp,log:Math.log,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,floor:Math.floor,sign:Math.sign,pi:Math.PI,e:Math.E};
const GK=Object.keys(GM),GV=Object.values(GM),GCOL=['#b9c3cf','#cfc2b0','#b4cbb9','#c6b6cf','#cfb4b4'];
function graphSvg(spec,color){try{const [cs,vp]=spec.split(';');const [x0,x1,y0,y1]=vp.split(',').map(Number);const W=600,H=Math.round(W*Math.min(.75,Math.max(.45,(y1-y0)/(x1-x0)))),
  X=x=>(x-x0)/(x1-x0)*W,Y=y=>H-(y-y0)/(y1-y0)*H;let g='',lg=[];
  const stepx=(x1-x0)>24?5:(x1-x0)>10?2:1,stepy=(y1-y0)>24?5:(y1-y0)>10?2:1;
  for(let t=Math.ceil(x0/stepx)*stepx;t<=x1;t+=stepx)g+=`<line x1="${X(t)}" y1="0" x2="${X(t)}" y2="${H}" stroke="var(--line)" stroke-width="${t===0?0:1}"/>`+(t&&Math.abs(Y(0)-H)>14?`<text x="${X(t)+3}" y="${Math.min(H-4,Math.max(12,Y(0)+14))}" font-size="12" fill="var(--muted)">${t}</text>`:'');
  for(let t=Math.ceil(y0/stepy)*stepy;t<=y1;t+=stepy)g+=`<line x1="0" y1="${Y(t)}" x2="${W}" y2="${Y(t)}" stroke="var(--line)" stroke-width="${t===0?0:1}"/>`+(t?`<text x="${Math.min(W-22,Math.max(4,X(0)+4))}" y="${Y(t)-3}" font-size="12" fill="var(--muted)">${t}</text>`:'');
  g+=`<line x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1.5"/><line x1="${X(0)}" y1="0" x2="${X(0)}" y2="${H}" stroke="var(--muted)" stroke-width="1.5"/>`;
  cs.split('|').map(c=>c.trim()).forEach((c,ci)=>{const pal=GCOL.filter(x=>x!==color);const col=ci===0?(color||pal[0]):pal[(ci-1)%pal.length];let d='',pen=false,prev=null;const pts=[];
    if(c.startsWith('y=')){const f=new Function(...GK,'x','return '+c.slice(2));for(let k=0;k<=900;k++){const x=x0+(x1-x0)*k/900;let y;try{y=f(...GV,x)}catch(e){y=NaN}pts.push([x,y])}}
    else if(c.startsWith('p=')){const a=c.slice(2).split(',');const fx=new Function(...GK,'t','return '+a[0]),fy=new Function(...GK,'t','return '+a[1]);const t0=new Function(...GK,'return '+a[2])(...GV),t1=new Function(...GK,'return '+a[3])(...GV);for(let k=0;k<=600;k++){const t=t0+(t1-t0)*k/600;pts.push([fx(...GV,t),fy(...GV,t)])}}
    const lim=(y1-y0)*0.6;
    pts.forEach(([x,y])=>{if(!isFinite(y)||y<y0-lim||y>y1+lim){pen=false;prev=null;return}if(prev&&Math.abs(y-prev)>lim&&c.startsWith('y=')){pen=false}d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=true;prev=y});
    g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;lg.push([col,c.replace(/^y=/,'y = ').replace(/^p=/,'(x, y) = ').replace(/\*\*/g,'^').replace(/\*/g,'·')])});
  return `<div class="graph" role="img" aria-label="Graph"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><rect width="${W}" height="${H}" fill="var(--surface)"/>${g}</svg><div class="lg">${lg.map(([c,t])=>`<span><i style="background:${c}"></i>${esc(t.length>48?t.slice(0,48)+'…':t)}</span>`).join('')}</div></div>`}catch(e){return ''}}

/* ---------- progress helpers ---------- */
function st(id){return S.cards[id]||(S.cards[id]={b:0,t:0,due:0,seen:0,ok:0,run:0})}
function isNew(id){return !S.cards[id]||!S.cards[id].seen}
function isMastered(id){const c=S.cards[id];return c&&c.b>=4&&!c.t}
function isDue(id){const c=S.cards[id];return c&&c.seen&&!c.t&&c.b<5&&c.due<=Date.now()}
function level(){let L=1;while(L<MAXL&&S.xp>=xpFor(L+1))L++;return L}
function xpFor(L){return Math.round(30*(L-1)*(L-1)+70*(L-1))}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function markDay(played){if(played&&!S.days.includes(today())){S.days.push(today());S.days=S.days.slice(-400);save()}}
function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(S.days.includes(k)){n++;d.setDate(d.getDate()-1)}else{if(n===0&&k===today()){d.setDate(d.getDate()-1);const k2=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(S.days.includes(k2)){continue}}break}}return n}
function inSel(ch){return !S.chap.length||S.chap.includes(ch)}
function isEasy(id){return !!S.cards[id]?.e}
function pileIds(k){return Object.keys(S.cards).filter(id=>S.cards[id][k]&&BYID[id]&&inSel(BYID[id].ch))}
function pool(){return DB.filter(c=>!isEasy(c.id)&&S.chap.includes(c.ch)&&(S.kind!=='t'||c.pyq)&&(S.kind!=='f'||!c.pyq)&&(!S.sec||(c.ch+'|'+c.si)===S.sec))}
function toughIds(){return Object.keys(S.cards).filter(id=>S.cards[id].t&&BYID[id])}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function chapterOf(k){return CHAPTERS.find(c=>c.k===k)}
function setFlame(k){document.documentElement.style.setProperty('--flame',chapterOf(k).color)}
function topbar(){document.getElementById('streak').textContent=streak();document.getElementById('xpTop').textContent=S.xp}

/* ---------- sound + fx ---------- */
let AC=null;
function beep(type){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const t=AC.currentTime;
 if(type==='ok'){o.type='triangle';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.08)}else if(type==='bad'){o.type='sawtooth';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(110,t+.2)}else{o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.setValueAtTime(780,t+.09);o.frequency.setValueAtTime(1040,t+.18)}
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+(type==='win'?.45:.25));o.start(t);o.stop(t+.5)}catch(e){}}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n=90){if(reduce)return;const cv=document.getElementById('fx'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#D7263D','#E89B00','#4E9A2F','#0E8F8A','#8A4FD8'];const P=[...Array(n)].map(()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:4+Math.random()*6,c:cols[Math.random()*5|0],r:Math.random()*6}));
 let f=0;(function tick(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<90)requestAnimationFrame(tick);else x.clearRect(0,0,cv.width,cv.height)})()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),1800)}
function gainXP(n,anchor){const before=level();S.xp+=n;save();topbar();if(anchor){const f=document.createElement('div');f.className='xpfly';f.textContent='+'+n+' XP';anchor.appendChild(f);setTimeout(()=>f.remove(),900)}
 const after=level();if(after>before){beep('win');confetti(140);toast('Level up! You are now '+ENAMES[after-1])}}

/* ---------- home ---------- */
function home(){hideBack();
  cur=null;topbar();const L=level(),lo=xpFor(L),hi=xpFor(Math.min(MAXL,L+1));
  const p=pool(),tough=toughIds().filter(id=>inSel(BYID[id].ch)).length;
  const due=p.filter(c=>isDue(c.id)).length,fresh=p.filter(c=>isNew(c.id)).length,mast=DB.filter(c=>isMastered(c.id)).length;
  const tileOf=c=>{const all=DB.filter(d=>d.ch===c.k),m=all.filter(d=>isMastered(d.id)).length,pc=Math.round(100*m/Math.max(1,all.length));
    return `<button class="chap" style="--c:${c.color}" data-ch="${c.k}" aria-pressed="${S.chap.includes(c.k)}"><span class="z">${all.length}</span><span class="pct">${pc}%</span><div class="sym">${c.sym}</div><div class="nm">${c.name}</div><div class="meter"><i style="width:${pc}%"></i></div></button>`};
  const chapHtml=Object.keys(UNITS).map(u=>{const cs=CHAPTERS.filter(c=>c.unit===u);if(!cs.length)return'';const allOn=cs.every(c=>S.chap.includes(c.k));
    return `<div class="unit" style="--c:${UNITS[u]}">${u}<button data-unit="${u}">${allOn?'Clear':'Select all'}</button></div><div class="chapters">${cs.map(tileOf).join('')}</div>`}).join('');
  let secOpts='<option value="">All parts of the chosen chapters</option>';
  if(S.chap.length===1){const k=S.chap[0];const seen=new Set();DB.filter(c=>c.ch===k).forEach(c=>{const key=k+'|'+c.si;if(!seen.has(key)){seen.add(key);secOpts+=`<option value="${key}" ${S.sec===key?'selected':''}>${esc(c.sec+'  '+plain(c.stitle))}</option>`}})}
  document.getElementById('app').innerHTML=`
  <section class="hero">
    <div class="tile" style="border-color:var(--ink)"><span class="z">${L}</span><span class="mass">${S.xp} XP</span><div class="sym">${ELEMENTS[L-1]}</div><div class="nm">Level ${L} · ${ENAMES[L-1]}</div></div>
    <div>
      <h1>Every JEE Advanced formula, ready in your head.</h1>
      <p>Read each formula with its conditions, derivation and graph, then test yourself: you see only the name and judge whether you can write it. Each card you know earns XP and moves you up from Pythagoras to Turing.</p>
      <div class="xpbar" aria-label="Progress to next level"><i style="width:${L>=MAXL?100:Math.min(100,100*(S.xp-lo)/(hi-lo))}%"></i></div>
      <div class="xpnote">${L>=MAXL?'Top level — every mathematician unlocked.':`${hi-S.xp} XP to reach ${ENAMES[L]}`}</div>
    </div>
  </section>
  <div class="statgrid">
    <div class="stat"><b>${mast}</b><span>mastered of ${DB.length}</span></div>
    <div class="stat"><b>${due}</b><span>due for review</span></div>
    <div class="stat"><b>${fresh}</b><span>not seen yet</span></div>
    <div class="stat"><b>${S.best}</b><span>best 60-second sprint</span></div>
  </div>
  <h2 class="sec">Pick your chapters</h2><p class="hint" style="margin-top:-6px">The small number on each tile is how many formula cards it has.</p>
  ${chapHtml}<div class="unit" style="--c:var(--ink)">Everything<button data-unit="*">${CHAPTERS.every(c=>S.chap.includes(c.k))?'Clear all':'Select all 30'}</button></div>
  ${S.chap.length?'':'<p class="hint">Tap one or more chapters to choose what to practise.</p>'}
  <div class="secpick">${S.chap.length===1?`<label for="secSel">Part:</label><select id="secSel">${secOpts}</select>`:S.chap.length?`<span style="color:var(--muted)">Select a single chapter to drill one part of it.</span>`:''}</div>
  <h2 class="sec">What to include</h2>
  <div class="counts" role="group" aria-label="Card kinds">${[['','All cards'],['f','Formulas only'],['t','Question types (solve like this)']].map(([k,t])=>`<button class="cnt" data-kind="${k}" aria-pressed="${(S.kind||'')===k}">${t}</button>`).join('')}</div>
  <h2 class="sec">How many questions?</h2>
  <div class="counts" role="group" aria-label="Questions per round">
    ${[10,20,30,50,100].map(n=>`<button class="cnt" data-n="${n}" aria-pressed="${S.round===n}">${n}</button>`).join('')}
    <button class="cnt" data-n="0" aria-pressed="${S.round===0}">All${S.chap.length?' '+p.length:''}</button>
    <label class="cnt-own">or type <input id="cntOwn" type="number" min="1" max="2359" inputmode="numeric" placeholder="e.g. 25" value="${[0,10,20,30,50,100].includes(S.round)?'':S.round}" class="${[0,10,20,30,50,100].includes(S.round)?'':'on'}"></label>
  </div>
  <h2 class="sec">Play</h2>
  <div class="modes">
    <button class="mode recapm" data-mode="recap" ${S.chap.length?'':'disabled'}><span class="t">Quick recap</span><span class="d">One dense sheet of every formula in the chosen chapters. Fast revision, printable.</span><span class="n">${S.chap.length?DB.filter(c=>S.chap.includes(c.ch)).length+' formulas':'Choose chapters first'}</span></button>
    <button class="mode read" data-mode="read" ${p.length?'':'disabled'}><span class="t">Read first</span><span class="d">Question and answer together, with the memory hook. Flip through fast, then practise the same cards.</span><span class="n">${S.chap.length?`${roundN()} cards · from #${(readPos()%p.length)+1}`:'Choose chapters first'}</span></button>
    <button class="mode" data-mode="play" ${p.length?'':'disabled'}><span class="t">Play a round</span><span class="d">See only the question. Know it? Move on. Forgot? Tap “Show answer”.</span><span class="n">${S.chap.length?`${roundN()} cards · ${due} due · ${fresh} new`:'Choose chapters first'}</span></button>
    <button class="mode" data-mode="sprint" ${p.length?'':'disabled'}><span class="t">60-second sprint</span><span class="d">How many formulas can you recall in one minute?</span><span class="n">${S.chap.length?`Best: ${S.best} known`:'Choose chapters first'}</span></button>
    <button class="mode tough" data-mode="tough"><span class="t">Difficult pile</span><span class="d">Cards you marked difficult. Know one three times in a row to clear it.</span><span class="n">${tough} card${tough===1?'':'s'}</span></button>
    <button class="mode pin" data-mode="pinned"><span class="t">Pinned</span><span class="d">Cards you pinned to keep handy. Read or practise them any time.</span><span class="n">${pileIds('p').length} card${pileIds('p').length===1?'':'s'}</span></button>
    <button class="mode easy" data-mode="easy"><span class="t">Very easy</span><span class="d">Taken out of every round. Open it to read them, test them or put cards back.</span><span class="n">${pileIds('e').length} card${pileIds('e').length===1?'':'s'}</span></button>
  </div>`;
  document.querySelectorAll('.chap').forEach(b=>b.onclick=()=>{const k=b.dataset.ch;S.chap=S.chap.includes(k)?S.chap.filter(x=>x!==k):[...S.chap,k];S.sec='';save();home()});
  document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{const u=b.dataset.unit;const ks=CHAPTERS.filter(c=>u==='*'||c.unit===u).map(c=>c.k);const allOn=ks.every(k=>S.chap.includes(k));
    S.chap=allOn?S.chap.filter(k=>!ks.includes(k)):[...new Set([...S.chap,...ks])];S.sec='';save();home()});
  document.querySelectorAll('.cnt[data-n]').forEach(b=>b.onclick=()=>{S.round=+b.dataset.n;save();home()});
  document.querySelectorAll('.cnt[data-kind]').forEach(b=>b.onclick=()=>{S.kind=b.dataset.kind;save();home()});
  const co=document.getElementById('cntOwn');co.onchange=()=>{const v=Math.round(+co.value);if(v>0){S.round=Math.min(v,DB.length);save();home()}};
  const ss=document.getElementById('secSel');if(ss)ss.onchange=()=>{S.sec=ss.value;save();home()};
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.mode));
}

/* ---------- sessions ---------- */
function roundN(){const n=pool().length;return S.round>0?Math.min(S.round,n):n}
function pickRound(n){const p=pool();const due=shuffle(p.filter(c=>isDue(c.id)));let fresh=p.filter(c=>isNew(c.id));if(S.shuffle)fresh=shuffle(fresh);
  let out=due.slice(0,n);if(out.length<n)out=out.concat(fresh.slice(0,n-out.length));
  if(out.length<n){const rest=shuffle(p.filter(c=>!out.includes(c)&&!S.cards[c.id]?.t)).sort((a,b)=>st(a.id).b-st(b.id).b);out=out.concat(rest.slice(0,n-out.length))}
  return out}
function newSession(mode,cards,tough,easyOK){cur={mode,tough:!!tough,easyOK:!!easyOK,cards,i:0,know:0,looked:0,combo:0,best:0,xp:0,mast:0,startLvl:level(),end:mode==='sprint'?Date.now()+60000:0,lookedIds:[],requeued:{},prev:null};markDay(true);next()}
function start(mode){
  if(mode==='tough')return pileList('t');
  if(mode==='pinned')return pileList('p');
  if(mode==='easy')return pileList('e');
  if(mode==='read')return startRead();
  if(mode==='recap')return recapView();
  let cards=mode==='sprint'?shuffle(pool().slice()).slice(0,400):pickRound(roundN());
  if(!cards.length){toast('Nothing to play in this selection');return}
  newSession(mode,cards,false);
}
function startTough(){const ids=shuffle(toughIds().filter(id=>inSel(BYID[id].ch)));if(!ids.length)return home();
  newSession('play',ids.slice(0,S.round>0?S.round:ids.length).map(id=>BYID[id]),true)}

function next(){
  while(cur.i<cur.cards.length&&!cur.easyOK&&isEasy(cur.cards[cur.i].id))cur.i++;
  if(cur.mode==='sprint'&&Date.now()>=cur.end)return summary();
  if(cur.i>=cur.cards.length)return summary();
  const c=cur.cards[cur.i];setFlame(c.ch);renderCard(c);
}
function headBar(){
  const pct=100*cur.i/cur.cards.length;
  return `<div class="playbar"><button class="iconbtn" id="quit">Stop</button>${cur.mode==='sprint'?`<div class="prog"><i id="tbar" style="width:100%"></i></div><div class="timer" id="clock">60</div>`:`<div class="prog"><i style="width:${pct}%"></i></div><span class="count">${cur.i+1}/${cur.cards.length}</span>`}<div class="combo" aria-live="polite">${cur.combo>1?'×'+cur.combo:''}</div></div>`}
function cardMeta(c){const ch=chapterOf(c.ch);return `<div class="meta"><span>${ch.name} · ${chem(c.stitle)}</span></div>`}
const MK={e:['Very easy','Very easy ✓'],t:['Difficult','Difficult ✓'],p:['Pin','Pinned ✓']};
function marksHtml(c,sm){const s=S.cards[c.id]||{};return `<div class="marks${sm?' sm':''}" role="group" aria-label="Mark this card">${['e','t','p'].map(k=>`<button data-mk="${k}" data-id="${c.id}" aria-pressed="${!!s[k]}">${MK[k][s[k]?1:0]}</button>`).join('')}</div>`}
function setMark(id,k,on){const s=st(id);s[k]=on;if(on&&k==='e'){s.t=false}if(on&&k==='t'){s.e=false;s.b=0;s.run=0}save();
  document.querySelectorAll(`[data-mk][data-id="${id}"]`).forEach(b=>{const v=!!s[b.dataset.mk];b.setAttribute('aria-pressed',v);b.textContent=MK[b.dataset.mk][v?1:0]})}
function bindMarks(onEasy){document.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{const id=b.dataset.id,k=b.dataset.mk,on=!S.cards[id]?.[k];setMark(id,k,on);
  if(k==='e'&&on){toast('Very easy — it won’t come back');if(onEasy)onEasy(id)}else if(k==='t'&&on){toast('Added to your difficult pile');beep('bad')}else if(k==='p'&&on)toast('Pinned')})}
function pressMark(k){const b=document.querySelector(`.qcard [data-mk="${k}"]`);if(b)b.click()}
function hookHtml(c){if(c.pyq&&(c.spot||c.steps))return methodHtml(c);return `${c.pyq?`<div class="pyqb">${esc(c.pyq)}</div>`:''}${c.note?`<div class="note">${c.pyq?'<b>How to solve:</b> ':''}${chem(c.note)}</div>`:''}${c.hook?`<div class="hook">${c.pyq?'':'<b>Memory hook</b> — '}${chem(c.hook)}</div>`:''}${c.g?graphSvg(c.g,chapterOf(c.ch).color):''}${c.deriv?`<details class="deriv"><summary>Derivation</summary><div>${chem(c.deriv)}</div></details>`:''}<div class="ref">${esc(c.ref)} · ${chem(c.stitle)}</div>`}
function setStar(c,on){setMark(c.id,'t',on)}
function bindCommon(c){document.getElementById('quit').onclick=()=>{clearInterval(cur&&cur.tick);summary()};
  bindMarks(()=>setTimeout(()=>{if(cur&&cur.cards[cur.i]===c){cur.prev=null;cur.i++;next()}},250))}
/* one card: question only; you judge yourself */
function renderCard(c){showBack();
  const app=document.getElementById('app');
  const prev=cur.prev?`<details class="prev"><summary>Check the last answer</summary><div><b>${chem(cur.prev.q)}</b><br>${chem(cur.prev.a)}</div></details>`:'';
  app.innerHTML=`<div class="play">${headBar()}<article class="qcard flip" id="qc">${cardMeta(c)}<div class="q">${c.pyq?'<span class="tag">Question type · solve like this</span>':''}${chem(c.q)}</div><div id="back"></div>
  ${cur.mode==='sprint'?'':marksHtml(c)}<div class="judge" id="judge"><button class="j-show" id="show">Show answer</button><button class="j-know" id="know">I know it<small>next card</small></button></div></article>
  ${prev}<p class="keys">→ or K: I know it · Space: show answer · then → next · E very easy · D difficult · P pin</p></div>`;
  bindCommon(c);cur.shown=false;
  document.getElementById('know').onclick=()=>know(c);
  document.getElementById('show').onclick=()=>reveal(c);
  if(cur.mode==='sprint'){const tb=document.getElementById('tbar'),ck=document.getElementById('clock');clearInterval(cur.tick);
    const upd=()=>{const left=Math.max(0,cur.end-Date.now());tb.style.width=(100*left/60000)+'%';ck.textContent=Math.ceil(left/1000);if(!left){clearInterval(cur.tick);summary()}};upd();cur.tick=setInterval(upd,200)}
}
function know(c){if(cur.shown)return;const s=st(c.id);s.seen++;S.seen++;S.right++;s.ok++;cur.know++;cur.combo++;cur.best=Math.max(cur.best,cur.combo);
  const wasM=isMastered(c.id);
  if(cur.tough||s.t){s.run=(s.run||0)+1;if(s.run>=3&&s.t){s.t=false;s.b=3;toast('Cleared from the difficult pile!');beep('win')}}else{s.b=Math.min(5,s.b+1)}
  s.due=Date.now()+INTERVAL[s.b]*DAY;if(!wasM&&isMastered(c.id))cur.mast++;
  const x=cur.mode==='sprint'?5+Math.min(10,cur.combo):10+Math.min(20,2*(cur.combo-1));cur.xp+=x;gainXP(x,document.getElementById('qc'));beep('ok');
  if(cur.combo>0&&cur.combo%10===0){confetti(60);toast(cur.combo+' in a row!')}
  save();cur.prev={q:c.q,a:c.a};cur.i++;setTimeout(next,cur.mode==='sprint'?120:220)}
function reveal(c){if(cur.shown)return;cur.shown=true;const s=st(c.id);s.seen++;S.seen++;cur.looked++;cur.combo=0;s.b=0;s.run=0;s.due=Date.now()+DAY/2;
  if(!cur.lookedIds.includes(c.id))cur.lookedIds.push(c.id);
  if(cur.mode!=='sprint'&&!cur.requeued[c.id]){cur.requeued[c.id]=1;cur.cards.push(c)}
  cur.xp+=2;S.xp+=2;save();topbar();
  document.getElementById('back').innerHTML=`<div class="a">${chem(c.a)}</div>${hookHtml(c)}`;
  const comboEl=document.querySelector('.combo');if(comboEl)comboEl.textContent='';
  const jg=document.getElementById('judge');jg.classList.add('one');
  jg.innerHTML=`<button class="j-next" id="nx">Next card<small>${cur.mode==='sprint'?'keep going':'it comes back once more'}</small></button>`;
  const nx=document.getElementById('nx');nx.focus({preventScroll:true});nx.onclick=()=>{cur.prev=null;cur.i++;next()}}

/* back navigation */
function showBack(){const b=document.getElementById('backBtn');if(b)b.hidden=false;try{if(!history.state||!history.state.v)history.pushState({v:1},'')}catch(e){}}
function hideBack(){const b=document.getElementById('backBtn');if(b)b.hidden=true}
function goHome(){if(cur&&cur.tick)clearInterval(cur.tick);cur=null;rd=null;home();window.scrollTo(0,0)}
addEventListener('popstate',()=>goHome());
document.addEventListener('click',e=>{if(e.target&&e.target.id==='backBtn'){try{if(history.state&&history.state.v){history.back();return}}catch(x){}goHome()}});

/* quick recap */
function recapView(){showBack();cur=null;rd=null;const notes=!!S.recapNotes;window.scrollTo(0,0);
  const chs=CHAPTERS.filter(c=>S.chap.includes(c.k));
  const body=chs.map(ch=>{const cards=DB.filter(c=>c.ch===ch.k&&(S.kind!=='t'||c.pyq)&&(S.kind!=='f'||!c.pyq));const groups=[];cards.forEach(c=>{let g=groups.find(x=>x.si===c.si);if(!g)groups.push(g={si:c.si,t:c.stitle,cs:[]});g.cs.push(c)});
    return `<h3 style="--c:${ch.color}">${esc(ch.name)} <span style="font-size:13px;color:var(--muted);font-weight:400">Class ${ch.cls}</span></h3>`+groups.map(g=>`<div class="rg"><h4>${chem(g.t)}</h4><div class="rgrid">${g.cs.map(c=>`<div class="ri"><div class="rp">${chem(c.q)}${S.cards[c.id]?.t?' · <b style="color:var(--bad)">difficult</b>':''}</div><div class="rf">${kx('\\displaystyle '+c.f,false)}</div>${c.pyq&&c.spot?`<div class="rn"><b>Spot:</b> ${chem(c.spot)}</div>`:''}${c.pyq&&c.steps?`<ol class="rn steps">${c.steps.split('||').map(x=>`<li>${chem(x.trim())}</li>`).join('')}</ol>`:''}${(notes||c.pyq)&&c.note?`<div class="rn">${chem(c.note)}</div>`:''}${c.pyq?`<div class="rn"><b>${esc(c.pyq)}</b></div>`:''}</div>`).join('')}</div></div>`).join('')}).join('');
  document.getElementById('app').innerHTML=`<div><div class="playbar recapbar"><button class="iconbtn" id="rcHome">Home</button><span style="font-weight:700">${chs.length} chapter${chs.length===1?'':'s'} · ${DB.filter(c=>S.chap.includes(c.ch)).length} formulas</span>
    <label class="toggle" style="margin-left:auto"><input type="checkbox" id="rcNotes" ${notes?'checked':''}> Show conditions</label><button class="iconbtn" id="rcPrint">Print / save PDF</button></div><div class="recap">${body}</div></div>`;
  document.getElementById('rcHome').onclick=home;document.getElementById('rcPrint').onclick=()=>print();
  document.getElementById('rcNotes').onchange=e=>{S.recapNotes=e.target.checked;save();recapView()}}

/* reader */
let rd=null;
function selKey(){return S.chap.slice().sort().join(',')+'|'+S.sec}
function readPos(){return (S.readPos||{})[selKey()]||0}
function startRead(list,pile){let cards,from=0;
  if(list){cards=list.slice()}else{const p=pool();if(!p.length)return;const n=roundN();from=readPos()%p.length;
    cards=p.slice(from,from+n);if(cards.length<n)cards.push(...p.slice(0,Math.min(from,n-cards.length)))}
  if(!cards.length)return;rd={cards,i:0,from,list:!!S.readList,pile:pile||''};markDay(true);readView()}
function readTop(){return `<div class="playbar"><button class="iconbtn" id="rquit">Stop</button><div class="prog"><i style="width:${rd.list?100:100*(rd.i+1)/rd.cards.length}%"></i></div><span class="count">${rd.list?rd.cards.length+' cards':(rd.i+1)+'/'+rd.cards.length}</span>
  <div class="rview" role="group" aria-label="View"><button data-v="0" aria-pressed="${!rd.list}">Cards</button><button data-v="1" aria-pressed="${rd.list}">List</button></div></div>`}
function readBind(){document.getElementById('rquit').onclick=()=>{rd=null;home()};
  document.querySelectorAll('.rview button').forEach(b=>b.onclick=()=>{rd.list=b.dataset.v==='1';S.readList=rd.list;save();readView()})}
function tBtn(){return ''}
function tBind(){bindMarks(rd&&!rd.list?(id=>setTimeout(()=>{if(rd&&!rd.list&&rd.cards[rd.i]?.id===id)readStep(1)},250)):null)}
function readView(){showBack();cur=null;if(rd&&rd.cards[rd.i])setFlame(rd.cards[rd.i].ch);const app=document.getElementById('app');window.scrollTo(0,0);
  if(rd.list){app.innerHTML=`<div class="play wide">${readTop()}<div class="rlist">${rd.cards.map((c,k)=>`<div class="rrow">${marksHtml(c,true)}<div><span class="n">${k+1}.</span><span class="rq">${chem(c.q)}</span> — <span class="ra">${chem(c.a)}</span></div><div class="rh">${c.note?chem(c.note)+' · ':''}${c.hook?'Hook: '+chem(c.hook)+' · ':''}${esc(chapterOf(c.ch).name)}</div></div>`).join('')}</div>
    <div class="rdone"><button class="btn primary" id="rprac">Practise these ${rd.cards.length} now</button>${rd.pile?'':`<button class="btn" id="rmore">Read the next ${roundN()}</button>`}</div></div>`;
    readBind();tBind();doneBind();return}
  const c=rd.cards[rd.i];
  app.innerHTML=`<div class="play">${readTop()}<article class="qcard rcard" id="qc">${cardMeta(c)}<div class="q">${c.pyq?'<span class="tag">Question type · solve like this</span>':''}${chem(c.q)}</div><div class="a">${chem(c.a)}</div>${hookHtml(c)}${marksHtml(c)}
  <div class="rnav"><button id="rprev" ${rd.i?'':'disabled'}>← Back</button><button class="go" id="rnext">${rd.i+1<rd.cards.length?'Next →':'Done reading'}</button></div></article>
  <p class="keys">→ or Space: next · ←: back · E very easy · D difficult · P pin · swipe left for next</p></div>`;
  readBind();tBind();
  document.getElementById('rprev').onclick=()=>readStep(-1);document.getElementById('rnext').onclick=()=>readStep(1)}
function readStep(d){if(!rd)return;const j=rd.i+d;if(j<0)return;if(j>=rd.cards.length)return readDone();rd.i=j;readView()}
function savePos(){if(rd.pile)return;const p=pool();S.readPos=S.readPos||{};S.readPos[selKey()]=(rd.from+rd.cards.length)%Math.max(1,p.length+rd.cards.filter(c=>isEasy(c.id)).length);save()}
function readDone(){savePos();
  document.getElementById('app').innerHTML=`<div class="play"><div class="summary" style="text-align:left"><h2 class="sec" style="margin-top:0">You read ${rd.cards.length} cards.</h2>
  <p>Now test yourself on the same cards: you'll see only the question and judge whether you know it.</p>
  <div class="rdone"><button class="btn primary" id="rprac">Practise these ${rd.cards.filter(c=>rd.pile==='e'||!isEasy(c.id)).length} now</button>${rd.pile?'':`<button class="btn" id="rmore">Read the next ${roundN()}</button>`}<button class="btn" id="rhome">Home</button></div></div></div>`;
  doneBind();document.getElementById('rhome').onclick=()=>{rd=null;home()};document.getElementById('rprac').focus()}
function doneBind(){document.getElementById('rprac').onclick=()=>{if(rd.list)savePos();const pile=rd.pile;const cs=rd.cards.filter(c=>pile==='e'||!isEasy(c.id));rd=null;
    if(!cs.length){toast('All of these are marked very easy');return home()}newSession('play',S.shuffle?shuffle(cs):cs,pile==='t',pile==='e')};
  const m=document.getElementById('rmore');if(m)m.onclick=()=>{if(rd.list)savePos();startRead()}}
addEventListener('keydown',e=>{if(!rd||rd.list||cur||document.getElementById('settings').classList.contains('open'))return;if(!document.getElementById('rnext'))return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();readStep(1)}else if(e.key==='ArrowLeft'){e.preventDefault();readStep(-1)}
  else{const mk={e:'e',E:'e',d:'t',D:'t',t:'t',T:'t',p:'p',P:'p'}[e.key];if(mk)pressMark(mk)}});
let rx=null;addEventListener('touchstart',e=>{rx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(rx==null||!rd||rd.list||cur||!document.getElementById('rnext'))return;const dx=e.changedTouches[0].clientX-rx;rx=null;if(Math.abs(dx)<80)return;readStep(dx<0?1:-1)},{passive:true});

/* summary */
function summary(){showBack();
  if(!cur)return home();clearInterval(cur.tick);const tot=cur.know+cur.looked,acc=tot?Math.round(100*cur.know/tot):0;
  let title=acc>=90?'Brilliant!':acc>=70?'Sharp work':acc>=40?'Good warm-up':'Keep going';
  if(cur.mode==='sprint'&&cur.know>S.best){S.best=cur.know;save();title='New sprint record!'}
  if(tot&&acc>=70){beep('win');confetti()}
  const L=level();const looked=cur.lookedIds.map(id=>BYID[id]);
  document.getElementById('app').innerHTML=`<div class="summary">
   <h2>${title}</h2><p style="color:var(--muted);margin:0">${cur.know} known · ${cur.looked} looked up${tot?` · ${acc}% from memory`:''}${cur.best>2?` · best streak ×${cur.best}`:''}</p>
   <div class="tile"><span class="z">${L}</span><span class="mass">+${cur.xp} XP</span><div class="sym">${ELEMENTS[L-1]}</div><div class="nm">Level ${L} · ${ENAMES[L-1]}${L>cur.startLvl?' — new level!':''}</div></div>
   ${cur.mast?`<p>${cur.mast} card${cur.mast>1?'s':''} newly mastered.</p>`:''}
   ${looked.length?`<h2 class="sec" style="text-align:left">Cards you looked up</h2><p style="text-align:left;color:var(--muted);margin-top:-6px">Mark the ones that still feel hard.</p><div class="list" style="text-align:left">${looked.map(c=>{const t=!!S.cards[c.id]?.t;return `<div class="li" style="--c:${chapterOf(c.ch).color}"><div><div class="lq">${chem(c.q)}</div><div class="la">${chem(c.a)}</div></div>${marksHtml(c,true)}</div>`}).join('')}</div>`:''}
   <div class="row"><button class="btn primary" id="again">Play again</button>${toughIds().length?'<button class="btn" id="gotough">Open difficult pile</button>':''}<button class="btn" id="gohome">Home</button></div></div>`;
  const mode=cur.mode,tough=cur.tough;cur=null;
  bindMarks();
  document.getElementById('again').onclick=()=>tough?startTough():start(mode);
  document.getElementById('gohome').onclick=home;const gt=document.getElementById('gotough');if(gt)gt.onclick=()=>pileList('t');
}

/* tough pile */
function toughList(){pileList('t')}
const PILE={t:{title:'Difficult pile',note:'Know a card three times in a row in practice and it leaves this pile on its own.',empty:'Nothing marked difficult in the chosen chapters. Tap “Difficult” on any card and it waits for you here.',rm:'Remove'},
  p:{title:'Pinned cards',note:'Pinned cards stay in your normal rounds too; this is just a quick place to find them.',empty:'Nothing pinned yet. Tap “Pin” on any card to keep it here.',rm:'Unpin'},
  e:{title:'Very easy pile',note:'These never appear in rounds, reading or sprints. Put a card back if you want it to return.',empty:'No very easy cards yet. Tap “Very easy” on a card you’ll never forget and it stops coming back.',rm:'Put back'}};
function pileList(k){showBack();cur=null;rd=null;const P=PILE[k];const ids=pileIds(k);const cards=ids.map(id=>BYID[id]).sort((a,b)=>DB.indexOf(a)-DB.indexOf(b));
  document.getElementById('app').innerHTML=`<div class="play"><div class="playbar"><button class="iconbtn" id="back2">Home</button></div>
  <h2 class="sec" style="margin-top:0">${P.title} · ${ids.length} card${ids.length===1?'':'s'}</h2>
  ${ids.length?`<p style="color:var(--muted);margin-top:0">${P.note}${S.chap.length?' Showing the chosen chapters only.':''}</p>
  <div class="row" style="justify-content:flex-start"><button class="btn" id="pread">Read them</button><button class="btn primary" id="pprac">Practise them</button></div>
  <div class="list">${cards.map(c=>`<div class="li" style="--c:${chapterOf(c.ch).color}"><div><div class="lq">${chem(c.q)}</div><div class="la">${chem(c.a)}</div></div><button class="iconbtn" data-rm="${c.id}">${P.rm}</button></div>`).join('')}</div>`
  :`<div class="empty">${P.empty}</div>`}</div>`;
  document.getElementById('back2').onclick=home;
  const pr=document.getElementById('pread');if(pr)pr.onclick=()=>startRead(cards,k);
  const pp=document.getElementById('pprac');if(pp)pp.onclick=()=>{if(k==='t')return startTough();newSession('play',shuffle(cards.slice()),false,k==='e')};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{setMark(b.dataset.rm,k,false);pileList(k)})}
/* keys */
addEventListener('keydown',e=>{if(!cur||document.getElementById('settings').classList.contains('open'))return;if(e.target.tagName==='SUMMARY')return;
  const c=cur.cards[cur.i];if(!c)return;
  if(!cur.shown){if(e.key==='ArrowRight'||e.key==='k'||e.key==='K'){e.preventDefault();know(c)}else if(e.key===' '||e.key==='ArrowDown'){e.preventDefault();reveal(c)}}
  else{if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();document.getElementById('nx')?.click()}}
  const mk={e:'e',E:'e',d:'t',D:'t',t:'t',T:'t',p:'p',P:'p'}[e.key];if(mk)pressMark(mk)});
/* swipe: right = I know it (before reveal) / next (after) */
let sx=null;addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(sx==null||!cur)return;const dx=e.changedTouches[0].clientX-sx;sx=null;const c=cur.cards[cur.i];if(!c||Math.abs(dx)<90)return;
  if(dx>0){if(!cur.shown)know(c);else document.getElementById('nx')?.click()}else if(!cur.shown)reveal(c)},{passive:true});

/* settings */
const dlg=document.getElementById('settings');
document.getElementById('openSettings').onclick=()=>{document.getElementById('optSound').checked=S.sound;document.getElementById('optShuffle').checked=S.shuffle;const orr=document.getElementById('optRound');if(![...orr.options].some(o=>+o.value===S.round)){const o=document.createElement('option');o.value=S.round;o.textContent=S.round;orr.appendChild(o)}orr.value=S.round;
  document.getElementById('code').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));dlg.classList.add('open');document.getElementById('closeSettings').focus()};
document.getElementById('closeSettings').onclick=()=>{S.sound=document.getElementById('optSound').checked;S.shuffle=document.getElementById('optShuffle').checked;S.round=+document.getElementById('optRound').value;save();dlg.classList.remove('open');if(!cur)home()};
document.getElementById('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('code').value);toast('Code copied')}catch(e){document.getElementById('code').select();toast('Select the code and copy it')}};
document.getElementById('loadCode').onclick=()=>{try{const s=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('code').value.trim()))));S=Object.assign(blank(),s);save();dlg.classList.remove('open');home();toast('Progress loaded')}catch(e){toast('That code is not valid — copy it again')}};
document.getElementById('resetAll').onclick=e=>{const b=e.currentTarget;if(b.dataset.armed){S=blank();save();delete b.dataset.armed;b.textContent='Reset all progress';dlg.classList.remove('open');home();toast('Progress reset')}else{b.dataset.armed='1';b.textContent='Tap again to erase everything';setTimeout(()=>{delete b.dataset.armed;b.textContent='Reset all progress'},4000)}};
addEventListener('keydown',e=>{if(e.key==='Escape'&&dlg.classList.contains('open'))document.getElementById('closeSettings').click()});
document.getElementById('home').onclick=()=>{if(cur&&cur.tick)clearInterval(cur.tick);home()};
boot();
</script>
<script>
/* installable app + offline */
(function(){
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
  const ib=document.getElementById('installApp');let ev=null;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;ib.hidden=false});
  ib.onclick=async()=>{if(!ev)return;ev.prompt();try{await ev.userChoice}catch(e){}ev=null;ib.hidden=true};
  addEventListener('appinstalled',()=>{ib.hidden=true;try{toast('Installed — open IOC 100 from your apps')}catch(e){}});
})();
</script>
</body>
